name: Build LifeLens APK

on:
  push:
    branches: [ main, master, "claude/*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: life_lens
        run: flutter pub get

      - name: Patch app_usage namespace
        run: |
          APP_USAGE_DIR=$(find ~/.pub-cache -path "*/app_usage-*/android" -type d | head -1)
          echo "app_usage dir: $APP_USAGE_DIR"
          if [ -n "$APP_USAGE_DIR" ]; then
            MANIFEST="$APP_USAGE_DIR/src/main/AndroidManifest.xml"
            GRADLE="$APP_USAGE_DIR/build.gradle"
            echo "Manifest: $MANIFEST"
            echo "Gradle: $GRADLE"
            if [ -f "$MANIFEST" ]; then
              PACKAGE=$(grep -oP 'package="\K[^"]+' "$MANIFEST" || grep -o 'package="[^"]*"' "$MANIFEST" | sed 's/package="//;s/"//')
              echo "Detected package: $PACKAGE"
            fi
            if [ -f "$GRADLE" ] && [ -n "$PACKAGE" ]; then
              if ! grep -q "namespace" "$GRADLE"; then
                sed -i "s/android {/android {\n        namespace '$PACKAGE'/" "$GRADLE"
                echo "Patched! New build.gradle:"
                cat "$GRADLE"
              else
                echo "Namespace already present, no patch needed"
              fi
            fi
          else
            echo "WARNING: app_usage not found in pub-cache"
          fi

      - name: Make gradlew executable
        working-directory: life_lens/android
        run: chmod +x gradlew

      - name: Analyze code
        working-directory: life_lens
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: life_lens
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-v1.0.${{ github.run_number }}
          path: life_lens/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30


      - name: Done!
        run: |
          echo "================================"
          echo " APK Ready!"
          echo " Download from Artifacts below"
          echo "================================"
