name: Build LifeLens APK

on:
  push:
    branches: [ main, master, "claude/*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: life_lens
        run: flutter pub get

      - name: Fix Flutter plugin compatibility issues
        run: |
          python3 << 'EOF'
          import os, re, glob

          COMPILE_SDK = 34

          pub_cache = os.path.expanduser("~/.pub-cache/hosted")
          gradle_files = glob.glob(f"{pub_cache}/**/android/build.gradle", recursive=True)
          print(f"Found {len(gradle_files)} plugin build.gradle files")

          for gradle_path in gradle_files:
              with open(gradle_path, 'r') as f:
                  content = f.read()
              modified = content

              # Fix 1: add missing namespace
              if 'namespace' not in modified:
                  manifest_path = os.path.join(os.path.dirname(gradle_path), 'src', 'main', 'AndroidManifest.xml')
                  if os.path.exists(manifest_path):
                      with open(manifest_path, 'r') as f:
                          manifest = f.read()
                      m = re.search(r'package="([^"]+)"', manifest)
                      if m:
                          package = m.group(1)
                          modified = re.sub(r'(android\s*\{)', f'\\1\n    namespace "{package}"', modified, count=1)

              # Fix 2: replace null flutter.compileSdkVersion with hardcoded value
              modified = re.sub(
                  r'flutter\.compileSdkVersion',
                  str(COMPILE_SDK),
                  modified
              )

              # Fix 3: add compileSdkVersion if completely missing inside android block
              if re.search(r'android\s*\{', modified) and 'compileSdk' not in modified:
                  modified = re.sub(
                      r'(android\s*\{)',
                      f'\\1\n    compileSdkVersion {COMPILE_SDK}',
                      modified, count=1
                  )

              if modified != content:
                  with open(gradle_path, 'w') as f:
                      f.write(modified)
                  print(f"Patched: {os.path.basename(os.path.dirname(os.path.dirname(gradle_path)))}")

          print("Done patching plugins.")
          EOF

      - name: Make gradlew executable
        working-directory: life_lens/android
        run: chmod +x gradlew

      - name: Analyze code
        working-directory: life_lens
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: life_lens
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-v1.0.${{ github.run_number }}
          path: life_lens/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30


      - name: Done!
        run: |
          echo "================================"
          echo " APK Ready!"
          echo " Download from Artifacts below"
          echo "================================"
