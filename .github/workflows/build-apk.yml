name: Build LifeLens APK

on:
  push:
    branches: [ main, master, "claude/*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: life_lens
        run: flutter pub get

      - name: Fix missing namespaces in Flutter plugins
        run: |
          python3 << 'EOF'
          import os, re, glob

          pub_cache = os.path.expanduser("~/.pub-cache/hosted")
          gradle_files = glob.glob(f"{pub_cache}/**/android/build.gradle", recursive=True)
          print(f"Found {len(gradle_files)} plugin build.gradle files")

          for gradle_path in gradle_files:
              with open(gradle_path, 'r') as f:
                  content = f.read()
              if 'namespace' in content:
                  continue
              # Find AndroidManifest.xml to get package name
              manifest_path = os.path.join(os.path.dirname(gradle_path), 'src', 'main', 'AndroidManifest.xml')
              if not os.path.exists(manifest_path):
                  continue
              with open(manifest_path, 'r') as f:
                  manifest = f.read()
              match = re.search(r'package="([^"]+)"', manifest)
              if not match:
                  continue
              package = match.group(1)
              # Inject namespace into android block
              new_content = re.sub(r'(android\s*\{)', f'\\1\n    namespace "{package}"', content, count=1)
              if new_content != content:
                  with open(gradle_path, 'w') as f:
                      f.write(new_content)
                  print(f"Patched: {gradle_path} -> namespace {package}")
          EOF

      - name: Make gradlew executable
        working-directory: life_lens/android
        run: chmod +x gradlew

      - name: Analyze code
        working-directory: life_lens
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: life_lens
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-v1.0.${{ github.run_number }}
          path: life_lens/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30


      - name: Done!
        run: |
          echo "================================"
          echo " APK Ready!"
          echo " Download from Artifacts below"
          echo "================================"
