name: Build LifeLens APK

on:
  push:
    branches: [ main, master, "claude/*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: life_lens
        run: flutter pub get

      - name: Make gradlew executable
        working-directory: life_lens/android
        run: chmod +x gradlew

      - name: Analyze code
        working-directory: life_lens
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: life_lens
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-v1.0.${{ github.run_number }}
          path: life_lens/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload to Firebase App Distribution
        if: ${{ secrets.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: life_lens/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Build #${{ github.run_number }} - ${{ github.event.head_commit.message }}"

      - name: Done!
        run: |
          echo "================================"
          echo " APK Ready!"
          echo " Download from Artifacts below"
          echo "================================"
