name: Build LifeLens APK

on:
  push:
    branches: [ main, master, "claude/*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: life_lens
        run: flutter pub get

      - name: Patch record_linux compatibility
        run: |
          python3 << 'EOF'
          import os, glob

          pub_cache = os.path.expanduser("~/.pub-cache/hosted")
          files = glob.glob(f"{pub_cache}/**/record_linux-*/lib/record_linux.dart", recursive=True)

          for path in files:
              with open(path, 'r') as f:
                  content = f.read()
              modified = content

              # Fix 1: hasPermission missing named param {bool request = true}
              modified = modified.replace(
                  'Future<bool> hasPermission(String recorderId) {',
                  'Future<bool> hasPermission(String recorderId, {bool request = true}) {'
              )

              # Fix 2: add startStream stub if missing
              if 'startStream' not in modified and 'RecordPlatform' in modified:
                  if "import 'dart:typed_data'" not in modified:
                      modified = "import 'dart:typed_data';\n" + modified
                  modified = modified.replace(
                      'class RecordLinux extends RecordPlatform {',
                      'class RecordLinux extends RecordPlatform {\n'
                      '  @override\n'
                      '  Future<Stream<Uint8List>> startStream(String recorderId, RecordConfig config) async {\n'
                      '    return Stream<Uint8List>.empty();\n'
                      '  }\n'
                  )

              if modified != content:
                  with open(path, 'w') as f:
                      f.write(modified)
                  print(f"Patched: {path}")
          print("record_linux patch done.")
          EOF

      - name: Fix Flutter plugin compatibility issues
        run: |
          python3 << 'EOF'
          import os, re, glob

          # Replace all flutter.xxx Gradle properties with hardcoded values
          FLUTTER_PROPS = {
              'flutter.compileSdkVersion': '35',
              'flutter.minSdkVersion':     '21',
              'flutter.targetSdkVersion':  '34',
              'flutter.versionCode':       '1',
              'flutter.versionName':       '"1.0"',
              'flutter.ndkVersion':        '"23.1.7779620"',
          }

          pub_cache = os.path.expanduser("~/.pub-cache/hosted")
          gradle_files = glob.glob(f"{pub_cache}/**/android/build.gradle", recursive=True)
          print(f"Found {len(gradle_files)} plugin build.gradle files")

          for gradle_path in gradle_files:
              with open(gradle_path, 'r') as f:
                  content = f.read()
              modified = content

              # Fix 1: replace ALL flutter.xxx property references
              for prop, value in FLUTTER_PROPS.items():
                  modified = modified.replace(prop, value)

              # Fix 2: add missing namespace
              if 'namespace' not in modified:
                  manifest_path = os.path.join(os.path.dirname(gradle_path), 'src', 'main', 'AndroidManifest.xml')
                  if os.path.exists(manifest_path):
                      with open(manifest_path, 'r') as f:
                          manifest = f.read()
                      m = re.search(r'package="([^"]+)"', manifest)
                      if m:
                          package = m.group(1)
                          modified = re.sub(r'(android\s*\{)', f'\\1\n    namespace "{package}"', modified, count=1)

              # Fix 3: add compileSdkVersion if completely missing
              if re.search(r'android\s*\{', modified) and 'compileSdk' not in modified:
                  modified = re.sub(
                      r'(android\s*\{)',
                      '\\1\n    compileSdkVersion 34',
                      modified, count=1
                  )

              if modified != content:
                  with open(gradle_path, 'w') as f:
                      f.write(modified)
                  print(f"Patched: {os.path.basename(os.path.dirname(os.path.dirname(gradle_path)))}")

          print("Done patching plugins.")
          EOF

      - name: Make gradlew executable
        working-directory: life_lens/android
        run: chmod +x gradlew

      - name: Analyze code
        working-directory: life_lens
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: life_lens
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeLens-v1.0.${{ github.run_number }}
          path: life_lens/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Done!
        run: |
          echo "================================"
          echo " APK Ready!"
          echo " Download from Artifacts below"
          echo "================================"
